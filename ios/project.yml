# The Xcode project, generated by XcodeGen: `cd ios && xcodegen`. Commit the
# generated GorillaRust.xcodeproj too, so building needs only Xcode.
name: GorillaRust
options:
  bundleIdPrefix: uk.org.jonwilliams
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9ZPNXSV9HU
    SWIFT_VERSION: "5.0"
    # gorilla.h, for the app's bridging header; the test targets read that
    # header too when they import the app, so every target needs the path.
    HEADER_SEARCH_PATHS: $(SRCROOT)/include
    # The release job sets both from Cargo.toml and the run number.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GorillaRust:
    type: application
    platform: iOS
    sources:
      - path: GorillaRust
    dependencies:
      - framework: GorillaRust.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: AVFAudio.framework
    info:
      path: GorillaRust/Info.plist
      properties:
        CFBundleDisplayName: Gorilla Rust
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: GorillaRust
        PRODUCT_BUNDLE_IDENTIFIER: uk.org.jonwilliams.gorilla-rust
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: GorillaRust/Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GorillaRustTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GorillaRustTests
    dependencies:
      - target: GorillaRust
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
  GorillaRustUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GorillaRustUITests
    dependencies:
      - target: GorillaRust
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  GorillaRust:
    build:
      targets:
        GorillaRust: all
    test:
      targets:
        - GorillaRustTests
        - GorillaRustUITests
