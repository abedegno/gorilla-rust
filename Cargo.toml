[package]
name = "gorilla-rust"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Jon Williams <jon@jonwilliams.org.uk>"]
description = "A pixel-faithful Rust port of the 1990 QBasic GORILLAS, measured against the original rather than guessed at"
repository = "https://github.com/abedegno/gorilla-rust"
readme = "README.md"
license = "MIT"
keywords = ["game", "qbasic", "gorillas", "retro", "dos"]
categories = ["games"]
exclude = ["reference/", "fixtures/", ".github/"]

[lib]
name = "gorillas"
path = "src/lib.rs"

[[bin]]
name = "gorilla-rust"
path = "src/main.rs"

[dependencies]
minifb = "0.28"
rodio = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
