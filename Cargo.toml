[package]
name = "gorilla-rust"
version = "1.3.0"
edition = "2021"
rust-version = "1.88"
authors = ["Jon Williams <jon@jonwilliams.org.uk>"]
description = "A pixel-faithful Rust port of the 1990 QBasic GORILLAS, measured against the original rather than guessed at"
repository = "https://github.com/abedegno/gorilla-rust"
readme = "README.md"
license = "MIT"
keywords = ["game", "qbasic", "gorillas", "retro", "dos"]
categories = ["games"]
# An allowlist: the crate is the game and what it needs to build. The
# tests are left out because they compare against the captures in
# fixtures/, which are part of the repository, not the crate.
include = ["src/**", "assets/**", "README.md", "LICENSE", "CHANGELOG.md", "docs/screenshot.png"]

[lib]
name = "gorillas"
path = "src/lib.rs"

[[bin]]
name = "gorilla-rust"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28"
rodio = "0.22"
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "Element",
    "GainNode",
    "HtmlCanvasElement",
    "ImageData",
    "Node",
    "OscillatorNode",
    "OscillatorType",
    "Performance",
    "Window",
] }

[dev-dependencies]
# Only the icon example writes PNGs.
png = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
