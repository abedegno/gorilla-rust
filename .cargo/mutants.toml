# Configuration for cargo-mutants, which the weekly Mutation testing
# workflow runs. It changes the code one small way at a time (flipping a
# comparison, replacing a return value) and reports each change the tests
# did not notice.
#
# Only code that no test can observe is left out: it needs a window, a
# sound card or a person, and is checked by playing the game. Everything
# else is in, including the parts known to be weakly pinned, so that their
# survivors stay visible.

exclude_globs = [
    # Argument parsing and opening the window.
    "src/main.rs",
    # A development tool for rendering screens to files.
    "examples/**",
    # The browser build. It only compiles for wasm32, so a native run
    # would report every mutant in it as missed. The Playwright tests
    # cover it instead.
    "src/web.rs",
    "src/qb/backend/web.rs",
]

# These match cargo-mutants' mutant names, which look like
# "src/qb/fixture.rs:56:5: replace art -> String with String::new()":
# the file, the position, and the function with its impl type, but no
# module path.
exclude_re = [
    # Opening the window needs a display. cargo-mutants 27 does not apply
    # these patterns to struct field deletions, so the three it makes from
    # Display::open's WindowOptions still show up as missed. They are
    # expected.
    "Display::",
    # The picture of the first difference that a failing fixture test
    # prints. Only a failing test ever shows it.
    "fixture\\.rs:.* in art$",
    "replace art -> String",
    # Equivalent mutants: no input can tell them apart from the original.
    # ega_rgb ORs together channels whose bits never overlap, so | and ^
    # agree.
    "screen\\.rs:.*replace \\| with \\^ in ega_rgb",
    # to_rgba's reserve only sizes the allocation.
    "screen\\.rs:.*replace \\* with [+/] in Screen::to_rgba",
    # cls_view's right edge: line_fill clamps to the screen anyway.
    "text\\.rs:59:56:",
    # The trajectory's y is scaled by ScrHeight / 350, which in mode 9 is
    # exactly 1, so multiplying and dividing by it agree.
    "shot\\.rs:88:71: replace \\* with / in Trajectory::at",
    # Zero wind returns before the arrow's direction is chosen.
    "replace > with >= in Game::draw_wind_arrow",
    # Without the sleep, wait_ms spins on the clock to the same deadline.
    # Only the CPU use differs.
    "replace sleep_ms with \\(\\)",
]
