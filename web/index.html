<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gorillas</title>
  <meta name="description" content="QBasic GORILLAS from 1991, ported to Rust and playing in your browser.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="screen" width="640" height="350" aria-label="The game screen"></canvas>
      <button id="start" class="overlay" type="button" disabled>Loading…</button>
    </div>
    <!-- tabindex="-1" on mute and the keypad: these buttons are pointer-only,
         so a key meant for the game can never land on and press one instead.
         A keyboard player who wants silence uses ?mute, which is remembered. -->
    <div class="controls">
      <button id="mute" type="button" tabindex="-1" aria-pressed="false">Sound on</button>
    </div>
    <div id="keypad" role="group" aria-label="Keypad">
      <!-- Two layouts, swapped by the ABC and 123 keys: numbers for the
           angles, speeds and points, and letters for the players' names. -->
      <div class="keys digits">
        <button type="button" data-key="7" tabindex="-1">7</button>
        <button type="button" data-key="8" tabindex="-1">8</button>
        <button type="button" data-key="9" tabindex="-1">9</button>
        <button type="button" data-key="Backspace" tabindex="-1" aria-label="Backspace">⌫</button>
        <button type="button" data-key="4" tabindex="-1">4</button>
        <button type="button" data-key="5" tabindex="-1">5</button>
        <button type="button" data-key="6" tabindex="-1">6</button>
        <button type="button" data-key="V" tabindex="-1">V</button>
        <button type="button" data-key="1" tabindex="-1">1</button>
        <button type="button" data-key="2" tabindex="-1">2</button>
        <button type="button" data-key="3" tabindex="-1">3</button>
        <button type="button" data-key="P" tabindex="-1">P</button>
        <button type="button" data-key="0" tabindex="-1">0</button>
        <button type="button" data-key="." tabindex="-1">.</button>
        <button type="button" data-switch="abc" tabindex="-1">ABC</button>
        <button type="button" data-key="Enter" tabindex="-1" aria-label="Enter">⏎</button>
      </div>
      <div class="keys letters" hidden>
        <button type="button" data-key="q" tabindex="-1">q</button>
        <button type="button" data-key="w" tabindex="-1">w</button>
        <button type="button" data-key="e" tabindex="-1">e</button>
        <button type="button" data-key="r" tabindex="-1">r</button>
        <button type="button" data-key="t" tabindex="-1">t</button>
        <button type="button" data-key="y" tabindex="-1">y</button>
        <button type="button" data-key="u" tabindex="-1">u</button>
        <button type="button" data-key="i" tabindex="-1">i</button>
        <button type="button" data-key="o" tabindex="-1">o</button>
        <button type="button" data-key="p" tabindex="-1">p</button>
        <button type="button" data-key="a" class="row2" tabindex="-1">a</button>
        <button type="button" data-key="s" tabindex="-1">s</button>
        <button type="button" data-key="d" tabindex="-1">d</button>
        <button type="button" data-key="f" tabindex="-1">f</button>
        <button type="button" data-key="g" tabindex="-1">g</button>
        <button type="button" data-key="h" tabindex="-1">h</button>
        <button type="button" data-key="j" tabindex="-1">j</button>
        <button type="button" data-key="k" tabindex="-1">k</button>
        <button type="button" data-key="l" tabindex="-1">l</button>
        <button type="button" class="shift" data-shift tabindex="-1" aria-label="Shift" aria-pressed="false">⇧</button>
        <button type="button" data-key="z" tabindex="-1">z</button>
        <button type="button" data-key="x" tabindex="-1">x</button>
        <button type="button" data-key="c" tabindex="-1">c</button>
        <button type="button" data-key="v" tabindex="-1">v</button>
        <button type="button" data-key="b" tabindex="-1">b</button>
        <button type="button" data-key="n" tabindex="-1">n</button>
        <button type="button" data-key="m" tabindex="-1">m</button>
        <button type="button" data-key="Backspace" class="back" tabindex="-1" aria-label="Backspace">⌫</button>
        <button type="button" class="switch" data-switch="123" tabindex="-1">123</button>
        <button type="button" data-key=" " class="space" tabindex="-1" aria-label="Space">space</button>
        <button type="button" data-key="Enter" class="enter" tabindex="-1" aria-label="Enter">⏎</button>
      </div>
    </div>
    <p id="error" role="alert" hidden></p>
  </main>
  <footer>
    <a href="https://github.com/abedegno/gorilla-rust">Source</a>
    ·
    <a href="https://github.com/abedegno/gorilla-rust/releases">Download for Windows, macOS and Linux</a>
    <!-- Filled in from the wasm build once it loads, so it names the build
         actually running; it stays hidden if the game cannot load. -->
    <span class="version" hidden>· <span id="version"></span></span>
  </footer>
  <script type="module" src="main.js"></script>
</body>
</html>
