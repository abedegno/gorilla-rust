name: Bug report
description: Something does not work, or does not match the original
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is about the port behaving differently from the original
        GORILLAS, please say so — those are the most useful reports here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The exact command, including any flags. If it depends on a particular
        game, pass --seed N so it can be reproduced.
      placeholder: gorilla-rust --seed 12345, then angle 45 velocity 50
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `gorilla-rust --version`, or the commit you built
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots are welcome, especially for anything visual.
