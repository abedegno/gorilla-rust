name: Pages

# A release tag deploys the browser version, so the page always matches
# the latest downloads. The github-pages environment must allow v* tags
# for that (see CONTRIBUTING.md). It can also be run by hand, but the
# environment only accepts a run from the default branch, so that is the
# one to choose.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The CLI must match the library exactly, or the page fails to load.
      - name: Find the wasm-bindgen version
        id: bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build
        run: web/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the test browsers
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp web/index.html web/style.css web/main.js _site/
          cp -R web/pkg _site/pkg

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
