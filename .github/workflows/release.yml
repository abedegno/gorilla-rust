name: Release

# A tag push builds everything and publishes a release. Running it by hand
# builds the same artifacts from any ref without publishing anything, which
# is how to check a change to the release itself; see docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (nothing is published)
        default: main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          staging="gorilla-rust-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/gorilla-rust "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          staging="gorilla-rust-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/gorilla-rust.exe "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          7z a "$staging.zip" "$staging"
          certutil -hashfile "$staging.zip" SHA256 > "$staging.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: gorilla-rust-${{ matrix.target }}
          path: |
            gorilla-rust-*.tar.gz*
            gorilla-rust-*.zip*
          if-no-files-found: error

  macos:
    name: universal-apple-darwin
    runs-on: macos-latest
    # Three notarizations usually take a few minutes each. This stops a
    # stuck one from holding the job for the six hour default.
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Before anything is built, so a tag that disagrees with Cargo.toml
      # fails in seconds.
      - name: Read the version
        run: echo "VERSION=$(packaging/version.sh)" >> "$GITHUB_ENV"

      # A release must be signed now that the project has a Developer ID,
      # so a tag push without the secrets is a mistake to stop. A manual
      # run without them still builds, unsigned, which is how forks and
      # dry runs work.
      - name: Decide whether to sign
        id: signing
        run: |
          missing=""
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -z "$missing" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::A release must be signed, and these secrets are not set:$missing. See docs/releasing.md."
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::These secrets are not set:$missing. This build is unsigned, and Gatekeeper will block it."
          fi

      # Apple's SDK is universal, so both slices build on the arm64 runner.
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Merge into a universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/gorilla-rust \
            target/aarch64-apple-darwin/release/gorilla-rust \
            target/x86_64-apple-darwin/release/gorilla-rust
          lipo -info dist/gorilla-rust

      # The same target as the build above, so it reuses its dependencies.
      - name: Draw the icon
        run: cargo run --release --target aarch64-apple-darwin --example icon -- "$RUNNER_TEMP/icon.png"

      - name: Import the signing certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in the certificate."
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/api_key.p8" >> "$GITHUB_ENV"

      # A bare executable cannot have its ticket stapled, so Gatekeeper
      # confirms this one online the first time it runs.
      - name: Sign and notarize the binary
        if: steps.signing.outputs.enabled == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" dist/gorilla-rust
          ditto -c -k --keepParent dist/gorilla-rust "$RUNNER_TEMP/binary.zip"
          packaging/macos/notarize.sh "$RUNNER_TEMP/binary.zip"

      - name: Build the app
        run: packaging/macos/make-app.sh "$VERSION" dist/gorilla-rust "$RUNNER_TEMP/icon.png" dist

      # Stapled before it goes in the disk image, so the app opens offline
      # even after it is copied out. No --deep: the bundle holds one binary,
      # and a window and sound output need no entitlements.
      - name: Sign, notarize and staple the app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$SIGNING_IDENTITY" dist/Gorillas.app
          ditto -c -k --keepParent dist/Gorillas.app "$RUNNER_TEMP/app.zip"
          packaging/macos/notarize.sh "$RUNNER_TEMP/app.zip"
          xcrun stapler staple dist/Gorillas.app

      # Apple Silicon will not run a bundle whose seal is broken, and
      # copying the binary in and adding Info.plist broke it.
      - name: Sign the app ad hoc
        if: steps.signing.outputs.enabled != 'true'
        run: codesign --force --sign - dist/Gorillas.app

      - name: Build the disk image
        run: packaging/macos/make-dmg.sh dist/Gorillas.app "dist/Gorillas-$VERSION.dmg"

      - name: Sign, notarize and staple the disk image
        if: steps.signing.outputs.enabled == 'true'
        run: |
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "dist/Gorillas-$VERSION.dmg"
          packaging/macos/notarize.sh "dist/Gorillas-$VERSION.dmg"
          xcrun stapler staple "dist/Gorillas-$VERSION.dmg"

      # What Gatekeeper will decide on a user's Mac, checked before
      # anything is uploaded. spctl rejects any bare executable as "not an
      # app", so the binary only gets codesign's check.
      - name: Check what Gatekeeper will see
        if: steps.signing.outputs.enabled == 'true'
        run: |
          dmg="dist/Gorillas-$VERSION.dmg"
          codesign --verify --strict --verbose=2 dist/gorilla-rust
          codesign --verify --strict --verbose=2 dist/Gorillas.app
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type execute --verbose dist/Gorillas.app
          spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          xcrun stapler validate dist/Gorillas.app
          xcrun stapler validate "$dmg"

      - name: Package
        run: |
          staging="gorilla-rust-universal-apple-darwin"
          mkdir -p "$staging"
          cp dist/gorilla-rust "$staging/"
          cp README.md LICENSE CHANGELOG.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"
          cp "dist/Gorillas-$VERSION.dmg" .
          shasum -a 256 "Gorillas-$VERSION.dmg" > "Gorillas-$VERSION.dmg.sha256"

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/api_key.p8" "$RUNNER_TEMP/certificate.p12"

      - uses: actions/upload-artifact@v7
        with:
          name: gorilla-rust-universal-apple-darwin
          path: |
            gorilla-rust-*.tar.gz*
            Gorillas-*.dmg*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, macos]
    # A manual run started from a tag in the Actions UI also has a tag
    # ref, and must build without publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Only this version's section of the changelog, not the whole file. A
      # tag with no section fails here, before anything is published, since
      # releasing without saying what changed is the mistake to catch.
      - name: Extract this version's release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            /^\[[^]]*\]: / { next }
            found
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          generate_release_notes: true

  # Fill in the formula and cask, audit them, and on a tag push, put them
  # in the tap and install both from it. A manual run stops after the
  # audit and pushes nothing. A pre-release tag (one with a hyphen) never
  # reaches the tap.
  homebrew:
    name: Homebrew
    needs: [build, macos, release]
    if: >-
      ${{ !cancelled()
          && needs.build.result == 'success'
          && needs.macos.result == 'success'
          && (github.event_name == 'workflow_dispatch'
              || (needs.release.result == 'success' && !contains(github.ref_name, '-'))) }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Fill in the formula and the cask
        run: |
          version="$(packaging/version.sh)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          packaging/homebrew/render.sh "$version" artifacts rendered
          cat rendered/Formula/gorilla-rust.rb rendered/Casks/gorillas.rb

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew
          path: rendered
          if-no-files-found: error

      # In a scratch tap, so nothing reaches the real one unless it passes.
      # --online checks the download URLs, which exist only once the
      # release is published, so a manual run audits offline.
      - name: Audit them
        run: |
          brew tap-new --no-git abedegno/scratch
          tap="$(brew --repository abedegno/scratch)"
          mkdir -p "$tap/Casks"
          cp rendered/Formula/gorilla-rust.rb "$tap/Formula/"
          cp rendered/Casks/gorillas.rb "$tap/Casks/"
          flags="--strict"
          if [ "$PUBLISH" = true ]; then flags="--strict --online"; fi
          brew style abedegno/scratch
          brew audit $flags --formula abedegno/scratch/gorilla-rust
          brew audit $flags --cask abedegno/scratch/gorillas
          brew untap abedegno/scratch

      # Only commits when the files differ, so re-running this for a
      # version the tap already has does nothing.
      - name: Push to the tap
        if: env.PUBLISH == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN is not set. See docs/releasing.md."
            exit 1
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/abedegno/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          cp rendered/Formula/gorilla-rust.rb tap/Formula/
          cp rendered/Casks/gorillas.rb tap/Casks/
          cd tap
          git add Formula Casks
          if git diff --cached --quiet; then
            echo "The tap already has gorilla-rust $VERSION."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "gorilla-rust $VERSION"
          git push origin HEAD

      # The same check the Pages workflow makes of the live site: install
      # from the real tap, as a user would, with both packages on one Mac.
      - name: Install from the tap
        if: env.PUBLISH == 'true'
        run: |
          brew tap abedegno/tap
          brew install abedegno/tap/gorilla-rust
          brew test abedegno/tap/gorilla-rust
          brew install --cask abedegno/tap/gorillas
          test "$(command -v gorilla-rust)" = "$(brew --prefix)/bin/gorilla-rust"
          test "$(gorilla-rust --version)" = "gorilla-rust $VERSION"
          spctl --assess --type execute --verbose /Applications/Gorillas.app

  # Install the formula on both Linux architectures from the live tap,
  # which proves each Linux URL, checksum and architecture choice. ALSA
  # comes from the system, as the formula's caveats say.
  homebrew-linux:
    name: Homebrew on Linux (${{ matrix.os }})
    needs: homebrew
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      - name: Install from the tap
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64
          brew install abedegno/tap/gorilla-rust
          brew test abedegno/tap/gorilla-rust
