name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # The game is a GUI-subsystem program on Windows so no console opens
      # behind it. Check that it really is, and that --version still prints.
      - name: Check the Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out="$(./target/debug/gorilla-rust.exe --version)"
          echo "$out"
          [[ "$out" == gorilla-rust* ]]
          python - <<'EOF'
          import struct
          exe = open("target/debug/gorilla-rust.exe", "rb").read()
          pe = struct.unpack_from("<I", exe, 0x3C)[0]
          subsystem = struct.unpack_from("<H", exe, pe + 24 + 68)[0]
          assert subsystem == 2, f"subsystem is {subsystem}, expected 2 (Windows GUI)"
          print("GUI subsystem: no console window")
          EOF

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Packaging scripts
        run: |
          packaging/test-version.sh
          packaging/test-workflows.sh

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Build
        run: cargo build

  wasm:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --lib --target wasm32-unknown-unknown

      - name: Clippy
        run: cargo clippy --lib --target wasm32-unknown-unknown

      # The rest runs the page itself, so a pull request that breaks the
      # browser version fails here rather than at the next release. One
      # browser keeps it quick; the Pages workflow runs all three.

      # The CLI must match the library exactly, or the page fails to load.
      - name: Find the wasm-bindgen version
        id: bindgen
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

      - name: Build the page
        run: web/build.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the test browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: web
        env:
          CI: "true"
        run: npx playwright test --project=chromium

      # Each failed test leaves the page's state at the failure here.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
