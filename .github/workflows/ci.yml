name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all-targets

      # The game is a GUI-subsystem program on Windows so no console opens
      # behind it. Check that it really is, and that --version still prints.
      - name: Check the Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          out="$(./target/debug/gorilla-rust.exe --version)"
          echo "$out"
          [[ "$out" == gorilla-rust* ]]
          python - <<'EOF'
          import struct
          exe = open("target/debug/gorilla-rust.exe", "rb").read()
          pe = struct.unpack_from("<I", exe, 0x3C)[0]
          subsystem = struct.unpack_from("<H", exe, pe + 24 + 68)[0]
          assert subsystem == 2, f"subsystem is {subsystem}, expected 2 (Windows GUI)"
          print("GUI subsystem: no console window")
          EOF

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libasound2-dev

      - name: Build
        run: cargo build
